; Supervisor program for the file-manager queue worker.
; Without a running worker, uploaded files never finish processing
; (thumbnails + metadata) and stay in the "Processing" state.
;
; Install: copy to /etc/supervisor/conf.d/file-manager-worker.conf
;          (edit the paths/user), then:
;   supervisorctl reread && supervisorctl update && supervisorctl start file-manager-worker:*

[program:file-manager-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/file-manager/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/file-manager
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/file-manager/storage/logs/worker.log
stopwaitsecs=3600
