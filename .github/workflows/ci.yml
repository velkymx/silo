name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif, fileinfo, pdo_sqlite, sqlite3, mbstring, bcmath, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif, fileinfo, pdo_sqlite, sqlite3, mbstring, bcmath, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare environment (SQLite + file drivers)
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite"
            echo "SESSION_DRIVER=file"
            echo "CACHE_STORE=file"
            echo "QUEUE_CONNECTION=sync"
            echo "SCOUT_DRIVER=database"
          } >> .env
          php artisan migrate --force
          php artisan storage:link

      - name: Build front end
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite
        run: npm run test:e2e
